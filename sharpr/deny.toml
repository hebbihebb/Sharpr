[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
ignore = [
    # paste (unmaintained) is a build-time proc-macro of glycin's common crates;
    # upstream has no replacement yet.
    { id = "RUSTSEC-2024-0436", reason = "proc-macro via glycin-common/gufo-common; upstream has no fix" },
    # The zbus family is pulled in only by glycin (glycin, glycin-common, glycin-utils,
    # gufo-common); Sharpr has no direct dependency and glycin owns the upgrade.
    { id = "RUSTSEC-2026-0370", reason = "zvariant via glycin only; unmaintained, no fix available to us" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via glycin/zbus only; unmaintained, no fix available to us" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via glycin/zvariant only; unmaintained, no fix available to us" },
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BlueOak-1.0.0",
    "LGPL-2.1-or-later",
    "GPL-3.0-or-later",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
