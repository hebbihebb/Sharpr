app-id: io.github.hebbihebb.Sharpr
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: sharpr
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Rename, Move, Trash and exports work anywhere in home, as natively (D34).
  - --filesystem=home
  # File chooser portal
  - --talk-name=org.freedesktop.portal.FileChooser
  # Show in file manager (Nautilus, Thunar, Dolphin, etc.)
  - --talk-name=org.freedesktop.FileManager1

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/sharpr/cargo
modules:
  # Visual search runtime (decision D24): only llama-server, on the processor,
  # with every CPU variant picked at run time. The build fetches nothing (no web
  # UI download, no OpenMP fetch) and has no HTTPS (no OpenSSL). Its plain
  # HTTP downloader remains, so Sharpr always starts it with --offline and
  # without inherited LLAMA_*/HF_* settings. The model itself is installed
  # by the user (D23), never bundled or downloaded.
  - name: llama-cpp
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/ggml-org/llama.cpp/archive/refs/tags/b11457.tar.gz
        sha256: 5c054b32f75fd774370329bab3cecd68f7dcc0a462eeb82b79aded501d47479e
    build-commands:
      - >-
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_RPATH='$ORIGIN'
        -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON
        -DGGML_OPENMP=OFF -DLLAMA_OPENSSL=OFF
        -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF
        -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_APP=OFF
        -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TOOLS=ON
      - cmake --build build --target llama-server
      - install -Dm755 build/bin/llama-server /app/libexec/sharpr-llama/llama-server
      - cp -a build/bin/lib*.so* /app/libexec/sharpr-llama/
      - install -Dm644 LICENSE /app/share/licenses/sharpr-llama/LICENSE

  # The same llama-server built with Vulkan for GPU indexing (D34), beside
  # the processor build as in native installs (`runtime-gpu/`). Sharpr asks it
  # for a card with room and falls back to the processor build otherwise.
  - name: llama-cpp-vulkan
    buildsystem: simple
    modules:
      # Build-time only: ggml's Vulkan backend needs these headers, which the
      # GNOME SDK lacks. Version matches the SDK's Vulkan loader.
      - name: spirv-headers
        buildsystem: cmake-ninja
        cleanup:
          - '*'
        sources:
          - type: archive
            url: https://github.com/KhronosGroup/SPIRV-Headers/archive/refs/tags/vulkan-sdk-1.4.321.0.tar.gz
            sha256: 5bbea925663d4cd2bab23efad53874f2718248a73dcaf9dd21dff8cb48e602fc
    sources:
      - type: archive
        url: https://github.com/ggml-org/llama.cpp/archive/refs/tags/b11457.tar.gz
        sha256: 5c054b32f75fd774370329bab3cecd68f7dcc0a462eeb82b79aded501d47479e
    build-commands:
      - >-
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_RPATH='$ORIGIN'
        -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON
        -DGGML_VULKAN=ON
        -DGGML_OPENMP=OFF -DLLAMA_OPENSSL=OFF
        -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF
        -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_APP=OFF
        -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TOOLS=ON
      - cmake --build build --target llama-server ggml-vulkan
      - install -Dm755 build/bin/llama-server /app/libexec/sharpr-llama-gpu/llama-server
      - cp -a build/bin/lib*.so* /app/libexec/sharpr-llama-gpu/

  - name: sharpr
    buildsystem: simple
    sources:
      - type: dir
        path: .flatpak-source
      - cargo-sources.json
    build-commands:
      - mkdir -p .cargo
      - |
        cat > .cargo/config.toml <<'EOF'
        [source.crates-io]
        replace-with = "vendored-sources"

        [source.vendored-sources]
        directory = "cargo/vendor"
        EOF
      - cargo --offline build --release --jobs 4
      - install -Dm755 target/release/sharpr /app/bin/sharpr
      - install -Dm644 data/io.github.hebbihebb.Sharpr.desktop /app/share/applications/io.github.hebbihebb.Sharpr.desktop
      - install -Dm644 data/io.github.hebbihebb.Sharpr.metainfo.xml /app/share/metainfo/io.github.hebbihebb.Sharpr.metainfo.xml
      - install -Dm644 data/io.github.hebbihebb.Sharpr.png /app/share/icons/hicolor/512x512/apps/io.github.hebbihebb.Sharpr.png
      - install -Dm644 data/io.github.hebbihebb.Sharpr.gschema.xml /app/share/glib-2.0/schemas/io.github.hebbihebb.Sharpr.gschema.xml
      - glib-compile-schemas /app/share/glib-2.0/schemas/
