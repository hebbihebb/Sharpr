[package]
name = "sharpr"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "A modern GTK4 + Libadwaita image library and viewer"
license = "GPL-3.0-or-later"

[[bin]]
name = "sharpr"
path = "src/main.rs"

[dependencies]
# GTK4 + Libadwaita UI stack
glycin = { version = "3", features = ["gdk4"] }
gtk4 = { version = "0.11", features = ["v4_12"] }
# ShortcutsDialog replaces the deprecated GTK window (available since 1.8).
# Fedora and the GNOME 50 Flatpak runtime both provide it.
libadwaita = { version = "0.9", features = ["v1_8"] }
glib = "0.22"
gio = "0.22"
gdk4 = { version = "0.11", features = ["v4_16"] }
# Already used by GTK. Enable its application-font API (Pango 1.56),
# provided by Fedora and GNOME 50; no additional package or runtime service.
pango = { version = "0.22", features = ["v1_56"] }

# Image decoding and thumbnail generation (pure Rust, thread-safe)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff", "bmp", "ico"] }
jpegxl-rs = { version = "0.14.0", features = ["vendored"] }
jpegxl-sys = { version = "0.12.1", features = ["vendored"] }
webp = "0.3"
libwebp-sys = "0.9"
turbojpeg = "1.0"
memmap2 = "0.9"

# renameat2(RENAME_NOREPLACE) for rename/move that can never overwrite a file;
# already in the tree through other crates
libc = "0.2"

# Metadata (EXIF / XMP / IPTC) via gexiv2 C library
rexiv2 = "0.10"

# Async communication between background threads and GTK main thread
async-channel = "2"

# Serialisation (config, cache)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

dirs = "5"
rustc-hash = "1.1"
r2d2 = "0.8"
r2d2_sqlite = "0.24"
rusqlite = { version = "0.31", features = ["bundled"] }
rayon = "1"
itoa = "1"
# Content fingerprints for file identity (ROADMAP Phase 4): xxh3-128, MIT,
# no dependencies with these features
twox-hash = { version = "2.1.4", default-features = false, features = ["std", "xxhash3_128"] }

[build-dependencies]
glib-build-tools = "0.22"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
